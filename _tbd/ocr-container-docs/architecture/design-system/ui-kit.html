<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>ocr project prep · UI Kit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --bg-page:    #0c0c10;
    --bg-surface: #15151b;
    --bg-raised:  #1d1d24;
    --bg-sunk:    #08080c;
    --border-1:   #222229;
    --border-2:   #2f2f38;
    --border-3:   #3f3f49;
    --ink-1:      #f0f0f2;
    --ink-2:      #b0b0b8;
    --ink-3:      #7a7a85;
    --ink-4:      #4e4e58;
    --accent:     #d6925a;
    --accent-ink: #1a0f08;
    --exact:      #5fbf6a;
    --fuzzy:      #e8a83a;
    --mismatch:   #dc6555;
    --ocr:        #5d9fdf;
    --gt:         #a888d4;
    --block:      #a89074;
    --para:       #7fb56a;
    --line:       #d088a8;
    --word:       #6e9cdf;
    --ui-font:    'Inter', system-ui, sans-serif;
    --mono-font:  'JetBrains Mono', ui-monospace, monospace;
  }
  [data-theme="light"] {
    --bg-page:    #f6f4ef;
    --bg-surface: #ffffff;
    --bg-raised:  #ecebe5;
    --bg-sunk:    #f0eee7;
    --border-1:   #d8d4c8;
    --border-2:   #c2bdaf;
    --border-3:   #a39e8d;
    --ink-1:      #1a1810;
    --ink-2:      #4a4538;
    --ink-3:      #7c7665;
    --ink-4:      #b0aa95;
    --accent:     #b85a2e;
    --accent-ink: #ffffff;
    --exact:      #2d8c3a;
    --fuzzy:      #b87b1f;
    --mismatch:   #b13d32;
    --ocr:        #2d6fb5;
    --gt:         #6e4ea5;
    --block:      #7a5e3a;
    --para:       #4d8a3a;
    --line:       #a8527a;
    --word:       #3d6bb8;
  }
  html, body { margin:0; padding:0; height:100%; background:var(--bg-page); color:var(--ink-1); font-family:var(--ui-font); }
  body { transition: background .15s, color .15s; -webkit-font-smoothing:antialiased; }
  #root { min-height:100%; }
  * { box-sizing: border-box; }
  a { color:inherit; text-decoration:none; }

  /* ===== primitives ===== */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px;
    height:30px; padding:0 12px; border-radius:6px;
    background:var(--bg-raised); border:1px solid var(--border-2);
    color:var(--ink-1); font-family:var(--ui-font); font-size:12px; font-weight:500;
    cursor:default; user-select:none; transition: background .12s, border-color .12s; white-space:nowrap; }
  .btn:hover { background:color-mix(in srgb, var(--bg-raised) 80%, var(--ink-1)); }
  .btn.sm { height:24px; padding:0 9px; font-size:11px; border-radius:5px; }
  .btn.lg { height:34px; padding:0 14px; font-size:13px; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover { background:color-mix(in srgb, var(--accent) 88%, white); }
  .btn.ghost { background:transparent; border-color:transparent; color:var(--ink-2); }
  .btn.ghost:hover { background:var(--bg-raised); color:var(--ink-1); }
  .btn.danger { color:var(--mismatch); border-color:color-mix(in srgb, var(--mismatch) 27%, transparent); background:color-mix(in srgb, var(--mismatch) 7%, transparent); }
  .btn.icon { width:30px; padding:0; }
  .btn.icon.sm { width:24px; }
  .btn:disabled, .btn.disabled { opacity:0.45; }

  .chip { display:inline-flex; align-items:center; gap:5px; height:20px; padding:0 8px;
    border-radius:10px; background:var(--bg-raised); border:1px solid var(--border-2);
    font-size:10.5px; font-weight:500; color:var(--ink-2); }
  .chip .dot { width:6px; height:6px; border-radius:50%; }
  .chip.dashed { border-style:dashed; color:var(--ink-3); }

  .pip { display:inline-flex; align-items:center; gap:4px; height:18px; padding:0 7px;
    border-radius:9px; font-size:10px; font-weight:600; letter-spacing:0.02em; }
  .pip .dot { width:5px; height:5px; border-radius:50%; }

  .input { height:28px; padding:0 10px; background:var(--bg-sunk); border:1px solid var(--border-2);
    border-radius:5px; font-family:var(--mono-font); font-size:12px; color:var(--ink-1); outline:none; }
  .input:focus { border-color:var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
  .input.lg { height:32px; font-size:13px; }
  .input::placeholder { color:var(--ink-3); }

  .key { display:inline-flex; align-items:center; justify-content:center;
    min-width:18px; height:18px; padding:0 5px; background:var(--bg-sunk);
    border:1px solid var(--border-3); border-bottom-width:2px; border-radius:3px;
    font-family:var(--mono-font); font-size:9.5px; font-weight:500; color:var(--ink-2); }

  .label { font-family:var(--ui-font); font-size:9.5px; font-weight:700;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-3); }
  .mono { font-family:var(--mono-font); }

  /* kit chrome */
  .kit-card { background:var(--bg-surface); border:1px solid var(--border-1); border-radius:10px;
    overflow:hidden; }
  .kit-card-h { padding:14px 18px; border-bottom:1px solid var(--border-1); background:var(--bg-page);
    display:flex; align-items:center; gap:10px; }
  .kit-card-h .num { width:24px; height:24px; border-radius:6px; background:var(--bg-raised);
    color:var(--ink-2); font-family:var(--mono-font); font-size:11px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; }
  .kit-card-h h2 { margin:0; font-size:15px; font-weight:600; color:var(--ink-1); }
  .kit-card-h .desc { font-size:11px; color:var(--ink-3); margin-left:6px; }
  .kit-card-b { padding:18px; display:flex; flex-direction:column; gap:14px; }
  .kit-row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .kit-sub { font-size:11px; color:var(--ink-3); font-weight:500; letter-spacing:0.02em; }
  .kit-sub b { color:var(--ink-2); font-weight:600; }

  .swatch { width:48px; height:48px; border-radius:6px; border:1px solid var(--border-2); }

  /* ===== job-prep extensions ===== */

  /* stage cells (mono letter squares used in pgdp-prep job views) */
  .stage-cell {
    width:22px; height:22px; border-radius:5px;
    display:inline-flex; align-items:center; justify-content:center;
    font-family:var(--mono-font); font-size:10px; font-weight:600;
    border:1px solid; flex:none; position:relative;
  }
  .stage-cell.s-done    { color:var(--exact);    background:color-mix(in srgb, var(--exact) 12%, transparent);    border-color:color-mix(in srgb, var(--exact) 40%, transparent); }
  .stage-cell.s-running { color:var(--ocr);      background:color-mix(in srgb, var(--ocr) 12%, transparent);      border-color:color-mix(in srgb, var(--ocr) 40%, transparent); }
  .stage-cell.s-err     { color:var(--mismatch); background:color-mix(in srgb, var(--mismatch) 12%, transparent); border-color:color-mix(in srgb, var(--mismatch) 40%, transparent); }
  .stage-cell.s-queued  { color:var(--ink-3);    background:var(--bg-sunk); border-color:var(--border-2); }
  @keyframes ocrspin { to { transform:rotate(360deg); } }
  .stage-cell.s-running::after {
    content:''; position:absolute; inset:-2px; border-radius:7px;
    border:1px solid color-mix(in srgb, var(--ocr) 50%, transparent);
    border-top-color:transparent; animation: ocrspin 1.2s linear infinite;
  }

  /* progress bar */
  .progress { display:flex; align-items:center; gap:10px; min-width:160px; }
  .progress .track { position:relative; flex:1; height:4px; border-radius:2px; background:var(--bg-sunk); overflow:hidden; }
  .progress .fill { position:absolute; inset:0 auto 0 0; border-radius:2px; background:var(--ink-2); }
  .progress.t-running .fill { background:var(--ocr); }
  .progress.t-errored .fill { background:var(--mismatch); }
  .progress.t-done    .fill { background:var(--exact); }
  .progress.t-review  .fill { background:var(--fuzzy); }
  .progress .count { font-family:var(--mono-font); font-size:10.5px; color:var(--ink-3); white-space:nowrap; font-variant-numeric:tabular-nums; }

  /* avatar + notification dot */
  .avatar { width:28px; height:28px; border-radius:14px; background:var(--bg-raised); border:1px solid var(--border-2);
    display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:var(--ink-2); }
  .notif-dot { position:absolute; top:2px; right:2px; min-width:14px; height:14px;
    border-radius:7px; background:var(--accent); color:var(--accent-ink);
    font-size:9px; font-weight:700; font-family:var(--mono-font);
    display:inline-flex; align-items:center; justify-content:center;
    padding:0 4px; border:2px solid var(--bg-page); }

  /* nav link */
  .nav-link { padding:6px 10px; border-radius:5px; color:var(--ink-3); font-size:12px; font-weight:500; }
  .nav-link:hover { color:var(--ink-1); background:var(--bg-raised); }
  .nav-link.active { color:var(--ink-1); background:var(--bg-raised); }

  /* page row */
  .page-row {
    display:grid; grid-template-columns: 1fr 140px 200px 110px 18px;
    align-items:center; gap:14px;
    padding:8px 16px 8px 14px;
    border-bottom:1px solid var(--border-1);
    cursor:default;
  }
  .page-row:hover { background:color-mix(in srgb, var(--bg-surface) 70%, var(--ink-1) 4%); }
  .page-row.sel { background:color-mix(in srgb, var(--accent) 7%, var(--bg-surface)); }
  .page-row.sel .mk { background:var(--accent); }
  .mk { width:2px; height:22px; border-radius:1px; background:transparent; }

  /* filter chip */
  .filter-chip { height:24px; padding:0 9px; border-radius:5px;
    background:var(--bg-raised); border:1px solid var(--border-2);
    color:var(--ink-2); font-size:11px; font-weight:500;
    display:inline-flex; align-items:center; gap:6px; cursor:default; }
  .filter-chip.on {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    color: var(--accent);
  }

  /* stat tile */
  .stat-tile { padding:14px 18px; flex:1; }
  .stat-tile .v { font-family:var(--mono-font); font-variant-numeric:tabular-nums;
    font-size:24px; font-weight:600; letter-spacing:-0.02em; line-height:1.1; }

  /* mode toggle (sister kit style) */
  .theme-seg { display:flex; align-items:center; gap:8px; padding:4px;
    background:var(--bg-surface); border:1px solid var(--border-1); border-radius:7px; }
  .theme-seg button { padding:4px 12px; border-radius:5px; border:none; cursor:pointer;
    background:transparent; color:var(--ink-2); font-family:var(--ui-font); font-size:11px; font-weight:600; }
  .theme-seg button.on { background:var(--bg-raised); color:var(--ink-1); }

  /* scrollbars */
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:5px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--border-3); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="ui-kit.jsx"></script>
</body>
</html>
